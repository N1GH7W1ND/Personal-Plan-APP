<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fed'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-text">我的工作台</span>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item" href="#/home"     data-route="home">     <span class="nav-icon">▦</span><span class="nav-label">首页总览</span><span class="nav-count" data-count="home"></span></a>
      <a class="nav-item" href="#/today"    data-route="today">    <span class="nav-icon">☑</span><span class="nav-label">今日计划</span><span class="nav-count" data-count="today"></span></a>
      <a class="nav-item" href="#/dev"      data-route="dev">      <span class="nav-icon">⌘</span><span class="nav-label">开发工作</span><span class="nav-count" data-count="dev"></span></a>
      <a class="nav-item" href="#/study"    data-route="study">    <span class="nav-icon">✎</span><span class="nav-label">学习</span><span class="nav-count" data-count="study"></span></a>
      <a class="nav-item" href="#/reading"  data-route="reading">  <span class="nav-icon">❐</span><span class="nav-label">阅读</span><span class="nav-count" data-count="reading"></span></a>
      <a class="nav-item" href="#/diet"     data-route="diet">     <span class="nav-icon">◍</span><span class="nav-label">饮食计划</span><span class="nav-count" data-count="diet"></span></a>
      <a class="nav-item" href="#/settings" data-route="settings"> <span class="nav-icon">⚙</span><span class="nav-label">数据与设置</span><span class="nav-count" data-count="settings"></span></a>
    </nav>

    <div class="sidebar-foot">
      <div class="progress-mini">
        <div class="progress-mini-text">今天 <b id="footDone">0/0</b> 完成</div>
        <div class="progress"><div class="progress-bar" id="footBar" style="width:0%"></div></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 class="page-title" id="pageTitle">首页总览</h1>
      <div class="topbar-right">
        <span class="today-chip" id="todayChip"></span>
        <button class="btn btn-primary" id="btnQuickAdd" title="快速添加（快捷键 A）">+ 快速添加</button>
        <button class="save-dot" id="saveDot" title="保存状态">
          <span class="dot"></span><span class="save-text">就绪</span>
        </button>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div class="toast-layer" id="toastLayer"></div>
<div class="modal-layer" id="modalLayer" hidden></div>

<script type="module" src="./app.js"></script>
</body>
</html>
